# FIXED: same workflow, but the job grants back the one scope the comment needs.
#
# Keep `permissions: {}` at the workflow level (deny by default), then re-grant
# `pull-requests: write` on just the job that posts the comment.
name: Fixed (job-level permissions)

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    # <-- THIS is the fix.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary-as-pr-comment: 'always'

      - name: Execute hello
        run: ./gradlew hello
